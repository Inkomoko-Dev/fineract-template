# Front-line OpenTelemetry Collector for bare-metal Tomcat / host JVM.
# Receives OTLP from host agents on published ports 4317/4318.
# Fineract health is checked via host.docker.internal (see compose extra_hosts).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      global:
        scrape_interval: 30s
      scrape_configs:
        - job_name: otel-collector
          static_configs:
            - targets: ["localhost:8888"]

  hostmetrics:
    root_path: /hostfs
    collection_interval: 30s
    scrapers:
      cpu:
      memory:
      disk:
      filesystem:
      network:
      load:

  httpcheck:
    targets:
      # Tomcat WAR on the host (FINERACT_SERVER_PORT=8080, SSL off on prod CBS).
      # Override via local dry-run if Tomcat is not running — check may fail harmlessly.
      - endpoint: http://host.docker.internal:8080/fineract-provider/actuator/health
        method: GET
      - endpoint: http://signoz-otel-collector:13133/
        method: GET

processors:
  batch:
    send_batch_size: 8192
    timeout: 5s
  resourcedetection:
    detectors: [env, system, docker]
    timeout: 5s
  resource/infra:
    attributes:
      - key: deployment.environment
        value: prod
        action: upsert
      - key: service.namespace
        value: fineract
        action: upsert

exporters:
  otlp/signoz:
    endpoint: signoz-otel-collector:4317
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [otlp/signoz]
    metrics:
      receivers: [otlp, prometheus]
      processors: [resourcedetection, batch]
      exporters: [otlp/signoz]
    metrics/infra:
      receivers: [hostmetrics, httpcheck]
      processors: [resource/infra, resourcedetection, batch]
      exporters: [otlp/signoz]
    logs:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [otlp/signoz]
